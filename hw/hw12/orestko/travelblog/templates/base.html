<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %} {% endblock %} - TravelBlog</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net" rel="stylesheet">
    <!-- Ваш власний стиль -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm mb-4">
    <div class="container">
        <a class="navbar-brand fw-bold" href="{{ url_for('index') }}">🌍 TravelBlog</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" href="{{ url_for('index') }}">Головна</a></li>
                <li class="nav-item"><a class="nav-link" href="{{ url_for('about') }}">Про проект</a></li>
                <li class="nav-item">
                    <a class="btn btn-warning btn-sm ms-lg-3 mt-2 mt-lg-0 fw-bold" href="{{ url_for('create') }}">+ Новий пост</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<div class="container">
    {% for message in get_flashed_messages() %}
        <div class="alert alert-info alert-dismissible fade show" role="alert">
            {{ message }}
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
    {% endfor %}

    <main class="content-area">
        {% block content %} {% endblock %}
    </main>
</div>

<footer class="text-center py-4 mt-5 text-muted border-top">
    <p>&copy; 2026 TravelBlog. Зроблено з ❤️ на Flask</p>
</footer>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net"></script>
</body>
</html>
