{% extends 'base.html' %}

{% block content %}
    <h2>{% block title %} {{ post['title'] }} {% endblock %}</h2>
    <span class="badge badge-primary">{{ post['created'] }}</span>
    <p>{{ post['content'] }}</p>
    <hr>
    <a href="{{ url_for('index') }}" class="btn btn-secondary btn-sm">Повернутися до списку</a>
{% endblock %}
