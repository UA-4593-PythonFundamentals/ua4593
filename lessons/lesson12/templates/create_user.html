<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Додати користувача</title>
    <!-- Підключення Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen py-8 px-4 sm:px-6 lg:px-8">

    <div class="max-w-2xl mx-auto">
        <!-- Кнопка повернення -->
        <div class="mb-6">
            <a href="/" class="text-sm font-medium text-blue-600 hover:text-blue-500 flex items-center gap-1">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path>
                </svg>
                Назад до списку
            </a>
        </div>

        <div class="bg-white shadow-xl rounded-2xl overflow-hidden border border-gray-100">
            <div class="bg-indigo-600 px-8 py-6">
                <h1 class="text-2xl font-bold text-white">Новий користувач</h1>
                <p class="text-indigo-100 text-sm mt-1">Заповніть форму нижче, щоб зареєструвати нового учасника системи.</p>
            </div>

            <form action="/users/create" method="POST" class="p-8 space-y-6">
                
                <!-- Поле Username -->
                <div>
                    <label for="username" class="block text-sm font-semibold text-gray-700">Ім'я користувача</label>
                    <div class="mt-1 relative rounded-md shadow-sm">
                        <input type="text" name="username" id="username" required
                            class="block w-full px-4 py-3 rounded-lg border-gray-300 bg-gray-50 border focus:ring-indigo-500 focus:border-indigo-500 text-gray-900 sm:text-sm transition duration-200"
                            placeholder="Наприклад: ivan_ivanov">
                    </div>
                </div>

                <!-- Поле Email -->
                <div>
                    <label for="email" class="block text-sm font-semibold text-gray-700">Електронна пошта</label>
                    <div class="mt-1">
                        <input type="email" name="email" id="email" required
                            class="block w-full px-4 py-3 rounded-lg border-gray-300 bg-gray-50 border focus:ring-indigo-500 focus:border-indigo-500 text-gray-900 sm:text-sm transition duration-200"
                            placeholder="mail@example.com">
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <!-- Поле Age -->
                    <div>
                        <label for="age" class="block text-sm font-semibold text-gray-700">Вік</label>
                        <div class="mt-1">
                            <input type="number" name="age" id="age" min="1" max="120" required
                                class="block w-full px-4 py-3 rounded-lg border-gray-300 bg-gray-50 border focus:ring-indigo-500 focus:border-indigo-500 text-gray-900 sm:text-sm transition duration-200"
                                placeholder="25">
                        </div>
                    </div>

                    <!-- Поле Phone -->
                    <div>
                        <label for="phone" class="block text-sm font-semibold text-gray-700">Номер телефону</label>
                        <div class="mt-1">
                            <input type="tel" name="phone" id="phone" required
                                class="block w-full px-4 py-3 rounded-lg border-gray-300 bg-gray-50 border focus:ring-indigo-500 focus:border-indigo-500 text-gray-900 sm:text-sm transition duration-200"
                                placeholder="+380...">
                        </div>
                    </div>
                </div>

                <!-- Кнопки дій -->
                <div class="pt-4 flex items-center justify-end gap-3">
                    <button type="reset" 
                        class="px-6 py-3 rounded-lg text-sm font-semibold text-gray-600 hover:bg-gray-100 transition duration-200">
                        Очистити
                    </button>
                    <button type="submit" 
                        class="px-8 py-3 rounded-lg text-sm font-bold text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 shadow-lg shadow-indigo-200 transition duration-200">
                        Створити профіль
                    </button>
                </div>

            </form>
        </div>
        
        <p class="mt-8 text-center text-xs text-gray-400 uppercase tracking-widest">
            Flask User Management System &bull; 2026
        </p>
    </div>

</body>
</html>
